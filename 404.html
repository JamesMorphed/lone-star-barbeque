<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Off the Board | Lone Star Barbeque</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face{font-family:"Bevan";font-style:normal;font-weight:400;font-display:swap;src:url("/fonts/bevan-400.woff2") format("woff2")}
@font-face{font-family:"Noto Sans";font-style:normal;font-weight:400;font-display:swap;src:url("/fonts/noto-400.woff2") format("woff2")}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#141210;color:#fff;font-family:"Noto Sans","Helvetica Neue",Arial,sans-serif;padding:24px}
.wrap{max-width:520px;text-align:center}
.tag{display:inline-block;background:#E72327;color:#fff;font-family:"Bevan","Rockwell",serif;text-transform:uppercase;font-size:13px;letter-spacing:.04em;padding:7px 14px}
h1{font-family:"Bevan","Rockwell",serif;text-transform:uppercase;font-size:clamp(30px,6vw,48px);line-height:1.05;letter-spacing:.01em;color:#fff;margin:20px 0 0}
p{font-size:16px;line-height:1.6;color:#DCD8D2;margin:16px 0 0}
.ctas{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;font-family:"Bevan","Rockwell",serif;text-transform:uppercase;letter-spacing:.02em;font-size:14px;padding:16px 24px;border:2px solid #fff;color:#fff;text-decoration:none;box-shadow:6px 6px 0 #E72327}
.btn:hover{background:#fff;color:#141210}
.btn-primary{background:#E72327;border-color:#E72327;box-shadow:6px 6px 0 #fff}
.btn-primary:hover{background:#C71A1E;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">404</span>
  <h1>That's off the board.</h1>
  <p>The page you're after isn't here, sold out, or never existed. Head back to the homepage, or go straight to ordering.</p>
  <div class="ctas">
    <a class="btn btn-primary" href="/">Back to the pit</a>
    <a class="btn" href="tel:01843663987">Call 01843 663987</a>
  </div>
</div>
</body>
</html>
